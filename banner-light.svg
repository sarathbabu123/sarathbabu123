<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="42%" cy="78%" r="110%">
      <stop offset="0%"  stop-color="#f8f5ed"/>
      <stop offset="55%" stop-color="#f2ede200"/>
      <stop offset="100%" stop-color="#ece7d8"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#2c2410"/>
      <stop offset="100%" stop-color="#7a5c1e"/>
    </linearGradient>
    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#f4f0e6" stop-opacity="0"/>
      <stop offset="18%" stop-color="#f4f0e6" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#f4f0e6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="50%" stop-color="#f4f0e6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f4f0e6" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" color-interpolation-filters="sRGB" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <clipPath id="bgClip"><rect width="1200" height="630"/></clipPath>
    <clipPath id="portraitClip"><rect x="640" y="0" width="560" height="630"/></clipPath>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,400&amp;family=Fira+Code:wght@400;500&amp;display=swap');
    .orb1 { animation: drift1 14s ease-in-out infinite alternate; }
    @keyframes drift1 { from { transform:translate(0,0); opacity:.07; } to { transform:translate(30px,-22px); opacity:.13; } }
    .orb2 { animation: drift2 19s ease-in-out infinite alternate; }
    @keyframes drift2 { from { transform:translate(0,0); opacity:.06; } to { transform:translate(-20px,18px); opacity:.11; } }
    .mote { animation: mote 7s ease-in-out infinite alternate; }
    @keyframes mote { from { opacity:.15; transform:translateY(0); } to { opacity:.55; transform:translateY(-12px); } }
  </style>

  <g clip-path="url(#bgClip)">
    <rect width="1200" height="630" fill="#f4f0e6"/>
    <rect width="1200" height="630" fill="url(#bg)"/>
    <circle cx="200" cy="420" r="300" fill="#8b6914" class="orb1" filter="url(#glow)" opacity=".07"/>
    <circle cx="980" cy="180" r="280" fill="#2d7a4f" class="orb2" filter="url(#glow)" opacity=".06"/>
    <circle cx="88"  cy="312" r="2.2" fill="#7a5c1e" class="mote" style="animation-delay:0s"/>
    <circle cx="310" cy="145" r="1.8" fill="#4a6b55" class="mote" style="animation-delay:2.3s"/>
    <circle cx="520" cy="490" r="2.5" fill="#7a5c1e" class="mote" style="animation-delay:1.1s"/>
    <circle cx="420" cy="75"  r="1.5" fill="#4a6b55" class="mote" style="animation-delay:4.7s"/>
    <circle cx="195" cy="560" r="2"   fill="#7a5c1e" class="mote" style="animation-delay:3.2s"/>

    <!-- Portrait -->
    <g clip-path="url(#portraitClip)">
      <image href="./char.png" x="648" y="40" width="510" height="590"
             preserveAspectRatio="xMidYMax meet" opacity=".92"/>
      <rect x="640" width="180" height="630" fill="url(#fadeLeft)" opacity=".9"/>
      <rect x="640" y="0" width="560" height="630" fill="url(#fadeBottom)" opacity=".6"/>
    </g>

    <!-- Overline -->
    <text x="62" y="118" font-family="'Fira Code',monospace" font-size="11" font-weight="500"
          fill="#4a6b55" letter-spacing="3" opacity=".8">DATA SCIENTIST  ·  BENGALURU, INDIA</text>
    <line x1="62" y1="130" x2="340" y2="130" stroke="#4a6b55" stroke-width=".8" opacity=".3"/>

    <!-- Name -->
    <text x="60" y="202" font-family="'EB Garamond',Georgia,serif" font-size="74" font-weight="600"
          fill="url(#nameGrad)" letter-spacing=".5">Sarath Babu P</text>

    <!-- Sub-role -->
    <text x="62" y="234" font-family="'EB Garamond',Georgia,serif" font-size="19"
          font-style="italic" fill="#4a6b55" letter-spacing=".3">Applied Machine Learning Engineer</text>

    <line x1="62" y1="256" x2="580" y2="256" stroke="#2c2410" stroke-width=".6" opacity=".1"/>

    <!-- Bio -->
    <text x="62" y="290" font-family="'EB Garamond',Georgia,serif" font-size="16"
          fill="#3d3828" letter-spacing=".2">I find signal in noise — the real kind, not the</text>
    <text x="62" y="313" font-family="'EB Garamond',Georgia,serif" font-size="16"
          fill="#3d3828" letter-spacing=".2">cleaned, pre-packaged kind. That takes patience.</text>
    <text x="62" y="347" font-family="'EB Garamond',Georgia,serif" font-size="16"
          fill="#6b6452" letter-spacing=".2">Currently: ML pipelines for EV fleets @ Mooving</text>
    <text x="62" y="369" font-family="'EB Garamond',Georgia,serif" font-size="16"
          fill="#6b6452" letter-spacing=".2">Formerly: IoT telemetry at Livguard Drivetrain</text>

    <line x1="62" y1="392" x2="440" y2="392" stroke="#2c2410" stroke-width=".6" opacity=".08"/>

    <!-- Quote -->
    <text x="62" y="418" font-family="'EB Garamond',Georgia,serif" font-size="20"
          font-style="italic" font-weight="500" fill="#2c2410" opacity=".6" letter-spacing=".3">"There is no secret ingredient.</text>
    <text x="62" y="442" font-family="'EB Garamond',Georgia,serif" font-size="20"
          font-style="italic" font-weight="500" fill="#2c2410" opacity=".6" letter-spacing=".3"> It's just you."</text>

    <!-- Stack chips (dark text on light) -->
    <g transform="translate(62,478)">
      <rect width="68" height="22" rx="11" fill="#7a5c1e" fill-opacity=".1" stroke="#7a5c1e" stroke-width=".7" stroke-opacity=".4"/>
      <text x="34" y="15" text-anchor="middle" font-family="'Fira Code',monospace" font-size="10" fill="#7a5c1e">Python</text>
    </g>
    <g transform="translate(140,478)">
      <rect width="72" height="22" rx="11" fill="#7a5c1e" fill-opacity=".1" stroke="#7a5c1e" stroke-width=".7" stroke-opacity=".4"/>
      <text x="36" y="15" text-anchor="middle" font-family="'Fira Code',monospace" font-size="10" fill="#7a5c1e">PyTorch</text>
    </g>
    <g transform="translate(222,478)">
      <rect width="64" height="22" rx="11" fill="#7a5c1e" fill-opacity=".1" stroke="#7a5c1e" stroke-width=".7" stroke-opacity=".4"/>
      <text x="32" y="15" text-anchor="middle" font-family="'Fira Code',monospace" font-size="10" fill="#7a5c1e">pandas</text>
    </g>
    <g transform="translate(296,478)">
      <rect width="92" height="22" rx="11" fill="#7a5c1e" fill-opacity=".1" stroke="#7a5c1e" stroke-width=".7" stroke-opacity=".4"/>
      <text x="46" y="15" text-anchor="middle" font-family="'Fira Code',monospace" font-size="10" fill="#7a5c1e">scikit-learn</text>
    </g>
    <g transform="translate(398,478)">
      <rect width="74" height="22" rx="11" fill="#7a5c1e" fill-opacity=".1" stroke="#7a5c1e" stroke-width=".7" stroke-opacity=".4"/>
      <text x="37" y="15" text-anchor="middle" font-family="'Fira Code',monospace" font-size="10" fill="#7a5c1e">MongoDB</text>
    </g>
    <g transform="translate(62,508)">
      <rect width="62" height="22" rx="11" fill="#4a6b55" fill-opacity=".1" stroke="#4a6b55" stroke-width=".7" stroke-opacity=".4"/>
      <text x="31" y="15" text-anchor="middle" font-family="'Fira Code',monospace" font-size="10" fill="#4a6b55">YOLOv8</text>
    </g>
    <g transform="translate(134,508)">
      <rect width="66" height="22" rx="11" fill="#4a6b55" fill-opacity=".1" stroke="#4a6b55" stroke-width=".7" stroke-opacity=".4"/>
      <text x="33" y="15" text-anchor="middle" font-family="'Fira Code',monospace" font-size="10" fill="#4a6b55">OpenCV</text>
    </g>
    <g transform="translate(210,508)">
      <rect width="54" height="22" rx="11" fill="#4a6b55" fill-opacity=".1" stroke="#4a6b55" stroke-width=".7" stroke-opacity=".4"/>
      <text x="27" y="15" text-anchor="middle" font-family="'Fira Code',monospace" font-size="10" fill="#4a6b55">Flask</text>
    </g>
    <g transform="translate(274,508)">
      <rect width="58" height="22" rx="11" fill="#4a6b55" fill-opacity=".1" stroke="#4a6b55" stroke-width=".7" stroke-opacity=".4"/>
      <text x="29" y="15" text-anchor="middle" font-family="'Fira Code',monospace" font-size="10" fill="#4a6b55">Plotly</text>
    </g>
    <g transform="translate(342,508)">
      <rect width="54" height="22" rx="11" fill="#4a6b55" fill-opacity=".1" stroke="#4a6b55" stroke-width=".7" stroke-opacity=".4"/>
      <text x="27" y="15" text-anchor="middle" font-family="'Fira Code',monospace" font-size="10" fill="#4a6b55">Linux</text>
    </g>

    <text x="62" y="597" font-family="'Fira Code',monospace" font-size="10.5"
          fill="#4a6b55" opacity=".45" letter-spacing="1.2">github.com/sarathbabu123  ·  Bengaluru, India</text>
  </g>
</svg>