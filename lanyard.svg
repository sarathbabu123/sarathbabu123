<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" width="440" height="560">
  <defs>
    <linearGradient id="strap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#c8a96e"/>
      <stop offset="100%" stop-color="#7da68a"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#131810"/>
      <stop offset="100%" stop-color="#090c07"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#c8a96e" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#7da68a" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="avatarRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#c8a96e"/>
      <stop offset="100%" stop-color="#7da68a"/>
    </linearGradient>
    <filter id="cardDrop" x="-15%" y="-10%" width="130%" height="120%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feOffset dx="0" dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="avatarClip">
      <circle cx="140" cy="132" r="51"/>
    </clipPath>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500&amp;family=EB+Garamond:ital,wght@0,500;0,600;1,400&amp;display=swap');
    .badge-group { transform-origin: 220px 0; animation: pendulum 3.2s cubic-bezier(.4,0,.2,1) forwards, sway 6s 3.2s ease-in-out infinite alternate; }
    @keyframes pendulum { 0%{rotate:-10deg;} 28%{rotate:7deg;} 54%{rotate:-4deg;} 76%{rotate:2deg;} 90%{rotate:-.5deg;} 100%{rotate:0deg;} }
    @keyframes sway { from{rotate:-1.5deg;} to{rotate:1.5deg;} }
    .status { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;r:5;} 50%{opacity:.4;r:3.5;} }
  </style>

  <g class="badge-group">
    <!-- Straps -->
    <path d="M 182 -20 L 205 108 L 214 108 L 192 -20 Z" fill="url(#strap)" opacity=".9"/>
    <path d="M 258 -20 L 235 108 L 226 108 L 248 -20 Z" fill="url(#strap)" opacity=".9"/>
    <text font-size="8.5" fill="rgba(255,255,255,.7)" letter-spacing="2"
          font-family="'Fira Code',monospace" transform="translate(193,18) rotate(80)">DATA SCIENTIST  ·  MOOVING  ·  BENGALURU</text>

    <!-- Clasp -->
    <circle cx="220" cy="108" r="12" fill="none" stroke="#c8b89a" stroke-width="3.5"/>
    <rect x="213" y="116" width="14" height="18" rx="3" fill="#556b5b"/>
    <circle cx="220" cy="140" r="6.5" fill="#131810" stroke="#b8c4b0" stroke-width="2.5"/>

    <!-- Badge card -->
    <g transform="translate(80,148)" filter="url(#cardDrop)">
      <rect width="280" height="376" rx="16" fill="url(#card)" stroke="rgba(200,169,110,.3)" stroke-width="1.4"/>
      <rect width="272" height="368" x="4" y="4" rx="12" fill="none" stroke="rgba(255,255,255,.04)" stroke-width="1"/>

      <!-- Top bar -->
      <rect width="280" height="38" rx="16" fill="url(#topbar)"/>
      <rect y="22" width="280" height="16" fill="url(#topbar)" opacity=".5"/>
      <text x="140" y="24" text-anchor="middle" font-family="'Fira Code',monospace"
            font-size="9.5" fill="#c8a96e" letter-spacing="2.5">MOOVING  ·  DATA SCIENCE R&amp;D</text>

      <!-- Avatar ring + image -->
      <circle cx="140" cy="132" r="56" fill="none" stroke="url(#avatarRing)" stroke-width="2"/>
      <circle cx="140" cy="132" r="51" fill="#1a2018"/>
      <image href="./avatar.png" x="89" y="81" width="102" height="102" clip-path="url(#avatarClip)"/>

      <!-- Status dot -->
      <circle cx="182" cy="174" r="8" fill="#131810"/>
      <circle cx="182" cy="174" r="5" fill="#7da68a" class="status"/>

      <!-- Name / role -->
      <text x="140" y="214" text-anchor="middle" font-family="'EB Garamond',serif"
            font-size="22" font-weight="600" fill="#eee9da">Sarath Babu P</text>
      <text x="140" y="234" text-anchor="middle" font-family="'EB Garamond',serif"
            font-size="13" font-style="italic" fill="#a3b899">Data Scientist &amp; ML Engineer</text>
      <text x="140" y="252" text-anchor="middle" font-family="'Fira Code',monospace"
            font-size="10.5" fill="#c8a96e" letter-spacing=".5">@sarathbabu123</text>

      <line x1="40" y1="265" x2="240" y2="265" stroke="#eee9da" stroke-width=".6" opacity=".1"/>

      <!-- Skill chips -->
      <g transform="translate(40,276)">
        <rect width="58" height="20" rx="10" fill="rgba(200,169,110,.12)" stroke="#c8a96e" stroke-width=".8" stroke-opacity=".5"/>
        <text x="29" y="14" text-anchor="middle" font-family="'Fira Code',monospace" font-size="9.5" fill="#c8a96e">Python</text>
      </g>
      <g transform="translate(108,276)">
        <rect width="60" height="20" rx="10" fill="rgba(125,166,138,.12)" stroke="#7da68a" stroke-width=".8" stroke-opacity=".5"/>
        <text x="30" y="14" text-anchor="middle" font-family="'Fira Code',monospace" font-size="9.5" fill="#7da68a">PyTorch</text>
      </g>
      <g transform="translate(178,276)">
        <rect width="60" height="20" rx="10" fill="rgba(200,169,110,.12)" stroke="#c8a96e" stroke-width=".8" stroke-opacity=".5"/>
        <text x="30" y="14" text-anchor="middle" font-family="'Fira Code',monospace" font-size="9.5" fill="#c8a96e">pandas</text>
      </g>

      <!-- Decorative barcode -->
      <g transform="translate(36,312)" opacity=".18">
        <rect x="0"    y="0" width="2.5" height="24" fill="#eee9da"/>
        <rect x="4.5"  y="0" width="1"   height="24" fill="#eee9da"/>
        <rect x="7.5"  y="0" width="3.5" height="24" fill="#eee9da"/>
        <rect x="13"   y="0" width="1.5" height="24" fill="#eee9da"/>
        <rect x="17"   y="0" width="4"   height="24" fill="#eee9da"/>
        <rect x="23.5" y="0" width="1"   height="24" fill="#eee9da"/>
        <rect x="27"   y="0" width="2.5" height="24" fill="#eee9da"/>
        <rect x="32"   y="0" width="5"   height="24" fill="#eee9da"/>
        <rect x="40"   y="0" width="1.5" height="24" fill="#eee9da"/>
        <rect x="44"   y="0" width="3"   height="24" fill="#eee9da"/>
        <rect x="50"   y="0" width="1"   height="24" fill="#eee9da"/>
        <rect x="54"   y="0" width="4"   height="24" fill="#eee9da"/>
        <rect x="61"   y="0" width="2"   height="24" fill="#eee9da"/>
        <rect x="66"   y="0" width="3.5" height="24" fill="#eee9da"/>
        <rect x="73"   y="0" width="1"   height="24" fill="#eee9da"/>
        <rect x="77"   y="0" width="2.5" height="24" fill="#eee9da"/>
        <rect x="82.5" y="0" width="5"   height="24" fill="#eee9da"/>
        <rect x="91"   y="0" width="1.5" height="24" fill="#eee9da"/>
        <rect x="95"   y="0" width="3"   height="24" fill="#eee9da"/>
        <rect x="101"  y="0" width="1"   height="24" fill="#eee9da"/>
        <rect x="105"  y="0" width="4.5" height="24" fill="#eee9da"/>
        <rect x="113"  y="0" width="1.5" height="24" fill="#eee9da"/>
        <rect x="118"  y="0" width="3.5" height="24" fill="#eee9da"/>
        <rect x="125"  y="0" width="1"   height="24" fill="#eee9da"/>
        <rect x="129"  y="0" width="2.5" height="24" fill="#eee9da"/>
        <rect x="135"  y="0" width="4"   height="24" fill="#eee9da"/>
        <rect x="143"  y="0" width="1.5" height="24" fill="#eee9da"/>
        <rect x="148"  y="0" width="3"   height="24" fill="#eee9da"/>
        <rect x="154"  y="0" width="1"   height="24" fill="#eee9da"/>
        <rect x="158"  y="0" width="4.5" height="24" fill="#eee9da"/>
        <rect x="166"  y="0" width="1.5" height="24" fill="#eee9da"/>
        <rect x="170"  y="0" width="3"   height="24" fill="#eee9da"/>
        <rect x="176"  y="0" width="1"   height="24" fill="#eee9da"/>
        <rect x="180"  y="0" width="3.5" height="24" fill="#eee9da"/>
        <rect x="187"  y="0" width="5"   height="24" fill="#eee9da"/>
        <rect x="196"  y="0" width="1.5" height="24" fill="#eee9da"/>
        <rect x="200"  y="0" width="2.5" height="24" fill="#eee9da"/>
      </g>
      <text x="101" y="350" text-anchor="middle" font-family="'Fira Code',monospace"
            font-size="8.5" fill="#a3b899" opacity=".45" letter-spacing="1.2">DS-SB-MOOVING-2026</text>
    </g>
  </g>
</svg>