<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210">
  <defs>
    <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12121c" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>
    <linearGradient id="rankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8511a" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&amp;family=Outfit:wght@600;800&amp;display=swap');
    text { font-family: 'Outfit', sans-serif; }
    .code-font { font-family: 'Fira Code', monospace; }
    .circle-rank {
      stroke-dasharray: 283;
      stroke-dashoffset: 45;
      animation: rankFill 2s ease-out forwards;
    }
    @keyframes rankFill {
      from { stroke-dashoffset: 283; }
      to { stroke-dashoffset: 45; }
    }
  </style>

  <rect width="400" height="210" rx="14" fill="url(#statsBg)" stroke="rgba(232, 81, 26, 0.3)" stroke-width="1.2" />
  
  <text x="24" y="36" font-size="15" font-weight="800" fill="#ffffff">⚡ R&amp;D &amp; Telemetry Overview</text>
  
  <g transform="translate(70, 120)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="7" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#rankGrad)" stroke-width="7" stroke-linecap="round" class="circle-rank" transform="rotate(-90)" />
    <text x="0" y="8" text-anchor="middle" font-size="28" font-weight="900" fill="#ffffff" class="code-font">A+</text>
    <text x="0" y="24" text-anchor="middle" font-size="9" font-weight="700" fill="#00f0ff" letter-spacing="1">RANK</text>
  </g>

  <g transform="translate(145, 70)" font-size="13.5" font-weight="600" fill="#cbd5e1">
    <g transform="translate(0, 0)">
      <text fill="#f97316">✦ IoT Logs Processed:</text>
      <text x="210" text-anchor="end" fill="#ffffff" class="code-font" font-weight="700">300M+</text>
    </g>
    <g transform="translate(0, 30)">
      <text fill="#f97316">✦ Vision Accuracy:</text>
      <text x="210" text-anchor="end" fill="#00f0ff" class="code-font" font-weight="700">98.1%</text>
    </g>
    <g transform="translate(0, 60)">
      <text fill="#f97316">✦ Route Efficiency Gain:</text>
      <text x="210" text-anchor="end" fill="#4ade80" class="code-font" font-weight="700">+30%</text>
    </g>
    <g transform="translate(0, 90)">
      <text fill="#f97316">✦ Total Commits:</text>
      <text x="210" text-anchor="end" fill="#ffffff" class="code-font" font-weight="700">1,240+</text>
    </g>
  </g>
</svg>