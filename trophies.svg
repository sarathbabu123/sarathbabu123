<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 140" width="820" height="140">
  <defs>
    <linearGradient id="trophyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120a21" />
      <stop offset="100%" stop-color="#0a0514" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&amp;family=Outfit:wght@700;800&amp;display=swap');
    text { font-family: 'Outfit', sans-serif; }
    .code-font { font-family: 'Fira Code', monospace; }
    .trophy-card {
      transition: transform 0.3s;
    }
  </style>

  <rect width="820" height="140" rx="16" fill="url(#trophyBg)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.5" />

  <g transform="translate(20, 20)">
    <g transform="translate(0, 0)" class="trophy-card">
      <rect width="180" height="100" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1" />
      <text x="90" y="38" text-anchor="middle" font-size="24">🏆</text>
      <text x="90" y="62" text-anchor="middle" font-size="12" font-weight="800" fill="#fbbf24">COMMIT MASTER</text>
      <text x="90" y="80" text-anchor="middle" font-size="10" font-weight="600" fill="#94a3b8" class="code-font">1,000+ Commits</text>
    </g>

    <g transform="translate(195, 0)" class="trophy-card">
      <rect width="180" height="100" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1" />
      <text x="90" y="38" text-anchor="middle" font-size="24">🚀</text>
      <text x="90" y="62" text-anchor="middle" font-size="12" font-weight="800" fill="#f472b6">AI ARCHITECT</text>
      <text x="90" y="80" text-anchor="middle" font-size="10" font-weight="600" fill="#94a3b8" class="code-font">Agent Systems</text>
    </g>

    <g transform="translate(390, 0)" class="trophy-card">
      <rect width="180" height="100" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1" />
      <text x="90" y="38" text-anchor="middle" font-size="24">⭐</text>
      <text x="90" y="62" text-anchor="middle" font-size="12" font-weight="800" fill="#00f0ff">STAR GAZER</text>
      <text x="90" y="80" text-anchor="middle" font-size="10" font-weight="600" fill="#94a3b8" class="code-font">100+ Repo Stars</text>
    </g>

    <g transform="translate(585, 0)" class="trophy-card">
      <rect width="180" height="100" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
      <text x="90" y="38" text-anchor="middle" font-size="24">🐍</text>
      <text x="90" y="62" text-anchor="middle" font-size="12" font-weight="800" fill="#c084fc">SNAKE CHAMPION</text>
      <text x="90" y="80" text-anchor="middle" font-size="10" font-weight="600" fill="#94a3b8" class="code-font">Daily Streak</text>
    </g>
  </g>
</svg>